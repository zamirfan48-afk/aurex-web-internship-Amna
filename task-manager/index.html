<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deck</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

  <div class="topbar">
    
    <div class="mark">🛰️</div>
    <div class="name mono">DECK</div>
    
    <nav>
      <a href="#tasks">Tasks</a>
      <a href="#calendar">Calendar</a>
      <a href="#timer">Timer</a>
    </nav>

    <div class="spacer"></div>

    <button id="themeBtn" title="Toggle theme">◑</button>

  </div>


  <main>

    <div class="readout">

      <div class="greet mono" id="greeting">GOOD DAY</div>
      <div class="time mono" id="bigClock">00:00<span class="sec">:00</span></div>
      <div class="date" id="bigDate"></div>

    </div>

    <div class="layout">

      <section class="panel" id="tasks">

        <h2><span class="accent">01</span> · Tasks</h2>

        <div class="tabs" id="tabs">

          <button data-f="all" class="active">All</button>
          <button data-f="today">Today</button>
          <button data-f="upcoming">Upcoming</button>
          <button data-f="completed">Done</button>

        </div>


        <form class="add-row" id="addForm">

          <input type="text" id="taskText" placeholder="New task…" autocomplete="off">
          <input type="date" id="taskDate">

          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
          </select>

          <button type="submit">Add</button>

        </form>

        <div id="taskList"></div>

      </section>


      <div class="stack">

        <section class="panel">

          <h2><span class="accent">02</span> · Today</h2>

          <div id="schedList"></div>

        </section>


        <section class="panel" id="calendar">

          <div class="calendar-header">

            <h2 style="margin:0"><span class="accent">03</span> · Calendar</h2>

            <div class="cal-nav">

              <button id="prevMonth">‹</button>

              <span id="monthLabel" class="mono" style="font-size:.68rem;font-weight:700"></span>

              <button id="nextMonth">›</button>

            </div>

          </div>

          <div class="cal-grid" id="calGrid"></div>

        </section>

      </div>

    </div>


    <section class="panel" id="timer">

      <h2><span class="accent">04</span> · Focus Timer</h2>

      <div class="timer-panel">

        <div class="dial" id="ring" style="--pct:0">

          <div class="dial-num">

            <div>
              <div class="tnum" id="timerNum">25:00</div>
              <div class="tlbl" id="timerLbl">READY</div>
            </div>

          </div>

        </div>


        <div class="timer-side">

          <div class="presets" id="presets">

            <button data-min="15">15 MIN</button>
            <button data-min="25" class="active">25 MIN</button>
            <button data-min="45">45 MIN</button>

          </div>

          <div class="timer-controls">

            <button id="tReset">↺ Reset</button>
            <button class="tc-play" id="tPlay">▶ Start</button>
            <button id="tSkip">⏭ Skip</button>

          </div>

        </div>

      </div>

    </section>

  </main>

  <script src="scripts/main.js"></script>
</body>

</html>
